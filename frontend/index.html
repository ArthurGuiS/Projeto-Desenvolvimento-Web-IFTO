<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PontoWeb - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <main class="login-container">
            <div class="card">
                <h1 class="text-center">PontoWeb</h1>
                <p class="text-center mt-2" style="color: var(--text-secondary); margin-bottom: 1.5rem;">Acesse sua conta para registrar seu ponto</p>
                
                <div id="error-message" class="alert alert-danger hidden" role="alert">
                    E-mail ou senha inválidos.
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" required placeholder="exemplo@empresa.com" aria-required="true">
                    </div>
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" required placeholder="********" aria-required="true">
                    </div>
                    <button type="submit" id="btn-login" class="btn btn-primary btn-block" style="width: 100%;">
                        <span>Entrar</span>
                    </button>
                </form>
            </div>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
