<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PontoWeb - Painel Funcionário</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div>
            <h1>PontoWeb</h1>
            <p id="nome-usuario" style="font-size: 0.9rem; opacity: 0.9;"></p>
        </div>
        <nav>
            <button id="btn-alterar-senha" class="btn btn-warning" style="margin-right: 0.5rem;">Alterar Senha</button>
            <button id="btn-sair" class="btn btn-danger">Sair</button>
        </nav>
    </header>
    
    <main>
        <section class="card text-center">
            <h2>Registro de Ponto</h2>
            <p style="margin-bottom: 1.5rem; color: var(--text-secondary);">Clique no botão abaixo para registrar sua entrada, pausa ou saída.</p>
            <button id="btn-bater-ponto" class="btn btn-primary" style="padding: 1rem 3rem; font-size: 1.2rem; font-weight: bold;">
                Registrar Ponto
            </button>
            <div id="feedback-ponto" class="mt-2"></div>
        </section>
        
        <section class="card">
            <h2>Meu Histórico</h2>
            <div id="historico-container" class="mt-2">
                <p class="text-center" style="color: var(--text-secondary);">Carregando histórico...</p>
                <!-- Registros serão carregados aqui -->
            </div>
        </section>
    </main>

    <!-- Modal Simples para Alterar Senha -->
    <div id="modal-senha" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000;">
        <div class="card" style="max-width: 400px; width: 90%;">
            <h3>Alterar Senha</h3>
            <form id="form-alterar-senha">
                <div class="form-group">
                    <label for="nova-senha">Nova Senha</label>
                    <input type="password" id="nova-senha" required minlength="6">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                    <button type="button" id="btn-cancelar-senha" class="btn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/funcionario.js"></script>
</body>
</html>
